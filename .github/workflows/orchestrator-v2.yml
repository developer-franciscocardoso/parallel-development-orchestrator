name: Orchestrator V2

on:
  push:
    branches: [main, codex/orchestrator-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    name: Release tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Pda.slnx
      - run: dotnet build Pda.slnx -c Release --no-restore -m:1
      - name: All Windows tests
        if: runner.os == 'Windows'
        run: dotnet test Pda.slnx -c Release --no-build -m:1
      - name: Portable modules and native capability boundary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for module in Core Persistence Providers Repositories Planning Admission \
              Scheduling Quality Dashboard; do
            dotnet test "tests/Pda.${module}.Tests" -c Release --no-build
          done
          dotnet test tests/Pda.Execution.Tests -c Release --no-build \
            --filter 'FullyQualifiedName~PlatformBoundaryTests'
          dotnet test tests/Pda.Agents.Tests -c Release --no-build \
            --filter 'FullyQualifiedName~SimulatesLifecycle'
